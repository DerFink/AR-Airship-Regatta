# 2026-10-28 08:15 – Test course_test aufgenommen
# 2026-10-28 08:06 – Test mit „ENDE“ gilt als bestanden, auch wenn Godot danach beim Beenden hängt (Zeitlimit 120 s)
# 2026-10-28 00:15 – Test airship_mode_test aufgenommen
# 2026-10-27 16:19 – Zeitlimit 3 min je Headless-Test (ein hängender Test blockierte den Lauf)
# 2026-10-27 15:13 – Test tail_test (Leitwerk-Konfiguration, Baukasten-Gesten) in die Testliste aufgenommen
# 2026-10-27 11:41 – Schritte laufen mit bash (sh im Container kannte pipefail nicht → Abbruch); Testausgaben erscheinen in der Lauf-Zusammenfassung
# 2026-10-27 11:29 – Erstversion: bei jedem Push Headless-Tests ausführen, Android-Debug-APK bauen und als Release veröffentlichen (feste Download-Adresse fürs Handy)
#
# Ablauf auf GitHub (kostenlos für öffentliche Repositories):
#   1. Godot 4.3 + Android-SDK kommen aus dem Open-Source-Container godot-ci
#   2. Projekt importieren, Headless-Tests laufen lassen (Abbruch bei Skriptfehler)
#   3. APK bauen (Debug-signiert – zum Selbst-Installieren, nicht für den Play Store)
#   4. Neues Release "Android-Build N" mit der APK; die neueste APK ist immer unter
#      https://github.com/<Konto>/<Repo>/releases/latest/download/ar-airship-regatta.apk
name: Android-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # nötig, um das Release anzulegen

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    defaults:
      run:
        shell: bash        # im Container sonst "sh" – der kennt z. B. pipefail nicht
    steps:
      - uses: actions/checkout@v4

      - name: Godot-Vorlagen und Android-Einstellungen bereitstellen
        run: |
          # Der Container legt alles unter /root ab, GitHub nutzt ein anderes HOME
          if [ "$HOME" != "/root" ]; then
            mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
            cp /root/.config/godot/editor_settings-*.tres ~/.config/godot/
          fi
          ls ~/.local/share/godot/export_templates ~/.config/godot

      - name: Projekt importieren
        run: godot --headless --import --path . || true

      - name: Headless-Tests
        run: |
          # Ergebnisse zusätzlich in die Zusammenfassung des Laufs (auf GitHub sichtbar)
          echo '## Headless-Tests' >> "$GITHUB_STEP_SUMMARY"
          for t in smoke_test chewie_test v03_test tail_test airship_mode_test course_test ui_test; do
            echo "=== $t"
            # Zeitlimit je Test: ein hängender Test bricht nach 3 min ab statt den Lauf zu blockieren
            rc=0; timeout 120 godot --headless --path . -s tests/$t.gd > out.txt 2>&1 || rc=$?
            # Godot 4.3 bleibt headless gelegentlich beim Beenden hängen (Thread-Join beim
            # Aufräumen). Ist der Test bis „ENDE“ durchgelaufen, zählt er als bestanden.
            if [ "$rc" = "124" ] && grep -q "ENDE" out.txt; then echo "Hinweis: $t vollständig, nur Beenden hing"; rc=0; fi
            grep -vE 'mesh_get_surface_count|Parameter "m" is null|at: mesh' out.txt | tee clean.txt
            { echo "### $t (Rückgabe $rc)"; echo '```'; tail -n 25 clean.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" = "124" ]; then echo "Test $t hängt (Zeitlimit)"; exit 1; fi
            if grep -qE "SCRIPT ERROR|Parse Error" out.txt; then echo "Test $t fehlgeschlagen"; exit 1; fi
          done

      - name: APK bauen
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android Debug" build/ar-airship-regatta.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: ar-airship-regatta-apk
          path: build/ar-airship-regatta.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android-Build ${{ github.run_number }}
          body: Debug-APK vom Commit ${{ github.sha }}. Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben).
          files: build/ar-airship-regatta.apk
          make_latest: true
